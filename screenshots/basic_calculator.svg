<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect width="100%" height="100%" fill="#101820"/><rect x="0" y="0" width="1000" height="58" fill="#243746"/><circle cx="28" cy="29" r="8" fill="#f16b6f"/><circle cx="55" cy="29" r="8" fill="#f4c95d"/><circle cx="82" cy="29" r="8" fill="#68c58b"/><text x="115" y="36" fill="#ffffff" font-family="Arial" font-size="20">Personal Mini-Toolkit — sample console capture</text><text x="34" y="100" fill="#7ee0b8" font-family="Arial" font-size="24" font-weight="bold">BASIC CALCULATOR TOOL</text><text x="34" y="145" fill="#e9f1f5" font-family="monospace" font-size="21">--- Basic Calculator ---</text><text x="34" y="177" fill="#e9f1f5" font-family="monospace" font-size="21">Enter the first number: 12</text><text x="34" y="209" fill="#e9f1f5" font-family="monospace" font-size="21">Enter the second number: 4</text><text x="34" y="241" fill="#e9f1f5" font-family="monospace" font-size="21">Choose an operation:</text><text x="34" y="273" fill="#e9f1f5" font-family="monospace" font-size="21">1. Addition (+)</text><text x="34" y="305" fill="#e9f1f5" font-family="monospace" font-size="21">2. Subtraction (-)</text><text x="34" y="337" fill="#e9f1f5" font-family="monospace" font-size="21">3. Multiplication (*)</text><text x="34" y="369" fill="#e9f1f5" font-family="monospace" font-size="21">4. Division (/)</text><text x="34" y="401" fill="#e9f1f5" font-family="monospace" font-size="21">Enter your choice (1-4): 4</text><text x="34" y="433" fill="#e9f1f5" font-family="monospace" font-size="21">Result: 3</text></svg>